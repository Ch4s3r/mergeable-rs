[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained without a safe upgrade; replacing it with jiff needs a new crate (issue #24)" },
  { id = "RUSTSEC-2026-0555", reason = "chrono-tz is unmaintained without a safe upgrade; replaced together with chrono (issue #24)" },
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "BSL-1.0",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

env:
  DEVENV_VERSION: v2.4.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
        with:
          extra_nix_config: |
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
      - name: Restore and save the Nix store (devenv) in the GitHub cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('devenv.nix', 'devenv.lock', 'devenv.yaml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
      - name: Cache cargo registry and target directory
        uses: Swatinem/rust-cache@v2
      - name: Install devenv
        run: nix profile install "github:cachix/devenv/$DEVENV_VERSION"
      - name: Format, lint, unit and contract tests
        run: devenv test

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v32
        with:
          extra_nix_config: |
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
      - name: Restore and save the Nix store (devenv) in the GitHub cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('devenv.nix', 'devenv.lock', 'devenv.yaml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
      - name: Cache cargo registry and target directory
        uses: Swatinem/rust-cache@v2
      - name: Install devenv
        run: nix profile install "github:cachix/devenv/$DEVENV_VERSION"
      - name: Next version from conventional commits
        id: version
        run: |
          version="$(devenv shell -- git cliff --bumped-version | tail -n 1)"
          version="${version#v}"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version already released, no releasable commits since"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to ghcr.io
        if: steps.version.outputs.release == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the image with Paketo buildpacks
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          devenv shell -- cargo set-version --package mergeable "$VERSION"
          devenv shell -- build-image "$IMAGE:$VERSION" --tag "$IMAGE:latest" --publish \
            --env BP_OCI_SOURCE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --env BP_OCI_VERSION="$VERSION" \
            --env BP_OCI_REVISION="$GITHUB_SHA"
      - name: Resolve the digest of the published image
        id: image
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          digest="$(devenv shell -- crane digest "$IMAGE:$VERSION" | tail -n 1)"
          [[ "$digest" == sha256:* ]] || { echo "unexpected digest: $digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Generate the SBOMs (CycloneDX and SPDX) of the published image
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.version.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          devenv shell -- syft scan "registry:$IMAGE@$DIGEST" --select-catalogers +sbom-cataloger \
            --output "cyclonedx-json=mergeable-rs-$VERSION.cdx.json" \
            --output "spdx-json=mergeable-rs-$VERSION.spdx.json"
      - name: Attest the build provenance of the image
        if: steps.version.outputs.release == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.version.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Attest the SBOM of the image
        if: steps.version.outputs.release == 'true'
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ steps.version.outputs.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: mergeable-rs-${{ steps.version.outputs.version }}.cdx.json
          push-to-registry: true
      - name: Tag and create the GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.version.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          devenv shell -- git cliff --unreleased --tag "v$VERSION" --output notes.md
          printf '\nImage: `%s:%s` (`%s`)\n' "$IMAGE" "$VERSION" "$DIGEST" >> notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md \
            "mergeable-rs-$VERSION.cdx.json" "mergeable-rs-$VERSION.spdx.json"

name: CI

on:
  pull_request:

permissions:
  contents: read

env:
  DEVENV_VERSION: v2.4.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          extra_nix_config: |
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
      - name: Restore and save the Nix store (devenv) in the GitHub cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('devenv.nix', 'devenv.lock', 'devenv.yaml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
      - name: Cache cargo registry and target directory
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install devenv
        run: nix profile install "github:cachix/devenv/$DEVENV_VERSION"
      - name: Format, lint, unit and contract tests
        run: devenv test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          extra_nix_config: |
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
      - name: Restore and save the Nix store (devenv) in the GitHub cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('devenv.nix', 'devenv.lock', 'devenv.yaml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
      - name: Install devenv
        run: nix profile install "github:cachix/devenv/$DEVENV_VERSION"
      - name: Build the image with Paketo buildpacks
        run: devenv shell -- build-image mergeable-rs:ci
      - name: Start the image and wait for /ping
        run: |
          openssl genpkey -algorithm RSA -out smoke-test-key.pem
          docker run -d --name mergeable-smoke-test -p 3000:3000 \
            -e APP_ID=1 -e WEBHOOK_SECRET=smoke-test -e PRIVATE_KEY="$(base64 -w 0 smoke-test-key.pem)" \
            mergeable-rs:ci
          for attempt in $(seq 1 30); do
            if [[ "$(curl -fsS http://localhost:3000/ping)" == "PONG" ]]; then
              echo "answered /ping after $attempt attempt(s)"
              exit 0
            fi
            sleep 1
          done
          docker logs mergeable-smoke-test
          exit 1

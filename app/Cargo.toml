[package]
name = "mergeable"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Mergeable GitHub App"
publish = false

[lib]
name = "mergeable"
path = "src/lib.rs"

[[bin]]
name = "mergeable"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.4"
fancy-regex = "0.20"
futures = "0.3"
hex = "0.4"
hmac = "0.13"
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto", "use_pem"] }
moka = { version = "0.12", features = ["future", "sync"] }
percent-encoding = "2"
prometheus-client = "0.26"
rand = "0.10"
redis = { version = "1.8", default-features = false, features = ["tokio-comp", "aio"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.11"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[dev-dependencies]
anyhow = "1"
form_urlencoded = "1"
pretty_assertions = "1"
rsa = { version = "0.10", features = ["encoding"] }

[lints]
workspace = true

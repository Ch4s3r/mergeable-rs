[package]
name = "mergeable"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Mergeable GitHub App"
publish = false

[lib]
name = "mergeable"
path = "src/lib.rs"

[[bin]]
name = "mergeable"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
fancy-regex = "0.20"
futures = "0.3"
hex = "0.4"
hmac = "0.13"
jiff = { version = "1.0.3", default-features = false, features = ["std", "tz-system", "tz-fat", "tzdb-bundle-always", "perf-inline"] }
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto", "use_pem"] }
moka = { version = "0.12", features = ["future", "sync"] }
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry-appender-tracing = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs", "http-proto", "reqwest-blocking-client", "reqwest-rustls", "grpc-tonic", "tls-ring", "tls-roots"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs"] }
percent-encoding = "2"
prometheus-client = "0.26"
rand = "0.10"
redis = { version = "1.8", default-features = false, features = ["tokio-comp", "aio", "tokio-rustls-comp"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[dev-dependencies]
anyhow = "1"
form_urlencoded = "1"
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["testing"] }
pretty_assertions = "1"
rsa = { version = "0.10", features = ["encoding"] }
sha1 = "0.11"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
